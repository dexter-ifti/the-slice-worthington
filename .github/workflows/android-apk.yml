name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build and sync Capacitor Android project
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Copy APK to download location
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/The-Slice-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-slice-android-apk
          path: apk/The-Slice-v1.0.0.apk
          if-no-files-found: error

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/The-Slice-v1.0.0.apk
          git diff --cached --quiet && exit 0
          git commit -m "Build Android APK [skip ci]"
          git push
