name: iOS Simulator Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Build iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=22.22.0 <23"
          cache: npm

      - name: Install dependencies and sync the iOS app
        run: |
          npm ci --no-audit
          npm run cap:sync:ios

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          app=build/ios/Build/Products/Debug-iphonesimulator/App.app
          test -f "$app/PrivacyInfo.xcprivacy"
          ditto -c -k --sequesterRsrc --keepParent "$app" ios-simulator.zip

      - name: Upload Simulator build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: the-slice-ios-simulator
          path: ios-simulator.zip
          if-no-files-found: error

  publish-preview:
    name: Update Appetize preview
    needs: build-ios-simulator
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: the-slice-ios-simulator

      - name: Upload to Appetize
        if: env.APPETIZE_API_TOKEN != '' && vars.APPETIZE_PUBLIC_KEY != ''
        uses: appetizeio/github-action-appetize@2a2c772c74955925c1a7575fea8e4d58056f547d # v1.1.0
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        with:
          apiToken: ${{ env.APPETIZE_API_TOKEN }}
          publicKey: ${{ vars.APPETIZE_PUBLIC_KEY }}
          appFile: ios-simulator.zip
          platform: ios
          note: The Slice iOS Simulator preview - ${{ github.sha }}
