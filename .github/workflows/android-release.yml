name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=22.22.0 <23"
          cache: npm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install and audit dependencies
        run: |
          npm ci --no-audit
          npm audit --omit=dev --audit-level=high

      - name: Build and sync the Android app
        run: npm run cap:sync

      - name: Build the signed release bundle
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing upload keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing upload keystore password}"
          : "${ANDROID_KEY_ALIAS:?Missing upload key alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing upload key password}"

          umask 077
          export ANDROID_KEYSTORE_PATH
          ANDROID_KEYSTORE_PATH=$(mktemp "$RUNNER_TEMP/slice-upload.XXXXXX")
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64

          ./gradlew --no-daemon bundleRelease
          bundle=app/build/outputs/bundle/release/app-release.aab
          LC_ALL=C jarsigner -verify "$bundle" | grep -F 'jar verified.'

          mkdir -p "$RUNNER_TEMP/slice-android-release"
          cp "$bundle" "$RUNNER_TEMP/slice-android-release/The-Slice.aab"
          cd "$RUNNER_TEMP/slice-android-release"
          sha256sum The-Slice.aab > SHA256SUMS

      - name: Generate release SBOM
        run: npm sbom --package-lock-only --omit=dev --sbom-format cyclonedx > "$RUNNER_TEMP/slice-android-release/sbom.cdx.json"

      - name: Upload Play internal testing bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: the-slice-android-release
          path: ${{ runner.temp }}/slice-android-release/
          if-no-files-found: error
